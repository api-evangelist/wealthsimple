aid: wealthsimple
name: Wealthsimple
description: 'Wealthsimple is a Toronto-based Canadian financial technology company, founded in 2014,
  offering a full suite of consumer financial products: managed investing (Invest), self-directed
  stock and ETF trading (Trade), cryptocurrency, tax filing (Tax), spending, saving, and cash and
  card products. It serves more than four million Canadians with roughly CAD $125 billion in assets
  under administration and reached a CAD $10 billion valuation in its 2025 Series F round. Wealthsimple
  does not publish an official public developer API or OpenAPI specification; programmatic account
  access is available only through open-banking aggregators (SnapTrade, Plaid) and community-built
  unofficial libraries. This profile captures the company''s public trust, security, and developer-adjacent
  surface (security.txt, HackerOne bug bounty, Trust Center, status page, verified GitHub organization).'
